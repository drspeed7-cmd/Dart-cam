name: Android APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Web-App in die App kopieren
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: APK bauen
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DartCam.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DartCam-apk
          path: DartCam.apk

      - name: Als Download veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Dart Cam App (neueste Version)
          body: |
            Neueste Android-Version der Dart Cam App.
            DartCam.apk herunterladen, öffnen und Installation aus unbekannten Quellen erlauben.
          files: DartCam.apk
          make_latest: true
