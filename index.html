<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<title>Dart Cam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: Turnier-TV-Grafik – klar, laut, aus 2 m Entfernung lesbar
   IDEA: die Score-Einblendung einer Dart-Übertragung
   PICTURE: Live-Kamera mit Ring-Overlay, daneben die große Restpunktzahl
   COLOUR and TYPE: Nachtschwarz, Board-Rot und Board-Grün, Sisal-Elfenbein; Barlow Condensed + Inter
   LAYOUT: Handy: Kamera, Spieler am Wurf, Mitspieler, feste Aktionsleiste. Breit: zwei Spalten */
:root{color-scheme:dark;--bg:#0d0f12;--s1:#161a1f;--s2:#1f242b;--line:rgba(255,255,255,.08);--ink:#f4efe3;--mut:#8e96a3;--red:#e5383b;--grn:#2bb673;--ivory:#efe0bd;--r:20px}
*{box-sizing:border-box;min-width:0}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,rgba(229,56,59,.16),transparent 60%),radial-gradient(900px 500px at -10% 30%,rgba(43,182,115,.10),transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
.num,h1,h2{font-family:"Barlow Condensed",Impact,sans-serif}
main{max-width:1180px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) max(4vw,14px) calc(110px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
header h1{font-size:28px;font-weight:800;margin:0;flex:1;letter-spacing:.02em}
header h1 span{color:var(--red)}
.logo{width:34px;height:34px}
.ib{width:46px;height:46px;display:grid;place-items:center;padding:0;border-radius:14px;background:var(--s1);border:1px solid var(--line)}
.ib svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.layout{display:grid;gap:16px}
@media(min-width:860px){.layout{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}.side{position:sticky;top:14px}}
.cam{position:relative;background:#000;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.45);min-height:220px;aspect-ratio:16/10}
.cam.live{aspect-ratio:auto}
.cam video{display:block;width:100%;height:auto}
.cam canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;background:repeating-radial-gradient(circle at 50% 50%,#14181d 0 18px,#101317 18px 36px)}
.empty[hidden]{display:none}
.empty p{color:var(--mut);margin:12px 0 0;font-size:14px}
.pill{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:8px;background:rgba(13,15,18,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600;pointer-events:none;border:1px solid var(--line)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.cam.live .pill i{background:var(--grn);box-shadow:0 0 0 0 rgba(43,182,115,.6);animation:pulse 2s infinite}
.hint{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(13,15,18,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:10px 14px;border-radius:14px;font-size:15px;pointer-events:none;border:1px solid var(--line)}
.hint:empty{display:none}
button,select,input{font:inherit;font-size:16px;color:var(--ink);background:var(--s2);border:1px solid var(--line);border-radius:14px;min-height:48px;padding:0 16px}
button{cursor:pointer;font-weight:600}
button:active{transform:scale(.97)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--ivory);outline-offset:2px}
.go{background:linear-gradient(180deg,#f04a4d,#c9282b);border:0;color:#fff;box-shadow:0 8px 24px rgba(229,56,59,.35)}
.ok{background:linear-gradient(180deg,#36c982,#22985f);border:0;color:#fff}
.hero{position:relative;border-radius:var(--r);padding:18px 18px 16px;background:linear-gradient(160deg,#1c2128,#12151a);border:1px solid var(--line);overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(229,56,59,.25),transparent 70%)}
.who{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--mut);font-size:14px}
.who b{color:var(--ink);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:12px;font-weight:600;color:var(--grn);background:rgba(43,182,115,.12);padding:3px 10px;border-radius:99px;white-space:nowrap}
.score{font-size:clamp(84px,24vw,132px);font-weight:800;line-height:.9;margin:6px 0 4px;letter-spacing:-.01em}
.co{min-height:30px}
.co span{display:inline-block;font-size:14px;font-weight:600;color:var(--ivory);background:rgba(239,224,189,.1);border:1px solid rgba(239,224,189,.2);padding:4px 12px;border-radius:99px}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.slot{min-height:74px;border-radius:14px;border:1.5px dashed rgba(255,255,255,.14);display:grid;place-items:center;color:var(--mut);font-size:13px;padding:6px;text-align:center;line-height:1.1}
.slot.f{border:1.5px solid var(--line);background:var(--s2);color:var(--ink)}
.slot.f b{display:block;font-family:"Barlow Condensed",Impact,sans-serif;font-size:28px;font-weight:700}
.slot.t3 b{color:var(--red)}.slot.t2 b{color:var(--grn)}
.slot.sel{border-color:var(--ivory);box-shadow:0 0 0 3px rgba(239,224,189,.2)}
.slot.bust{border-color:var(--red);background:rgba(229,56,59,.12)}
.sum{display:flex;justify-content:space-between;margin-top:12px;color:var(--mut);font-size:14px}
.sum b{font-family:"Barlow Condensed",Impact,sans-serif;font-size:22px;color:var(--ink)}
.sum.bust b{color:var(--red)}
.others{display:grid;gap:8px;margin-top:12px}
.op{display:flex;align-items:center;gap:12px;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--s2);color:var(--ivory);flex:none}
.op .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.op .num{font-size:28px;font-weight:700}
.crb{margin-top:12px;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:8px;overflow-x:auto}
.crb table{width:100%;border-collapse:collapse;text-align:center}
.crb th{font-size:13px;color:var(--mut);font-weight:600;padding:6px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crb th.on{color:var(--grn)}
.crb td{padding:4px;border-top:1px solid var(--line);font-size:22px;font-weight:700}
.crb td.num{color:var(--ivory);width:64px}
.mk.m3{color:var(--grn)}.mk.m1,.mk.m2{color:var(--ink)}
.sheet label[hidden]{display:none}
.note{color:var(--mut);font-size:13px;margin:12px 2px 0}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:3;padding:10px max(4vw,14px) calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(13,15,18,.95) 30%)}
.bar div{max-width:620px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px}
.bar button{min-height:54px;padding:0 8px;font-size:15px;background:rgba(31,36,43,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.bar .go{background:linear-gradient(180deg,#f04a4d,#c9282b)}
.sheet{position:fixed;inset:0;z-index:6;display:grid;align-items:end;background:rgba(0,0,0,.55)}
.sheet[hidden]{display:none}
.sheet>div{background:var(--s1);border-radius:24px 24px 0 0;border:1px solid var(--line);padding:10px 18px calc(18px + env(safe-area-inset-bottom));max-width:620px;width:100%;margin:0 auto;display:grid;gap:14px;max-height:90vh;overflow:auto}
.grab{width:44px;height:5px;border-radius:9px;background:rgba(255,255,255,.2);margin:0 auto}
.sheet h2{margin:0;font-size:26px}
.sheet label{display:grid;gap:6px;font-size:14px;color:var(--mut)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
input[type=range]{padding:0;accent-color:var(--red);background:none;border:0}
.win{position:fixed;inset:0;background:rgba(5,6,8,.88);backdrop-filter:blur(8px);display:none;place-items:center;text-align:center;z-index:7;padding:20px}
.win.on{display:grid}
.win .num{font-size:clamp(52px,14vw,96px);font-weight:800;color:var(--ivory);line-height:1}
.win p{color:var(--mut);margin:8px 0 22px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(43,182,115,.6)}70%{box-shadow:0 0 0 8px rgba(43,182,115,0)}100%{box-shadow:0 0 0 0 rgba(43,182,115,0)}}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:no-preference){.slot.f.new{animation:pop .25s ease-out}}
@media(prefers-reduced-motion:reduce){.cam.live .pill i{animation:none}}
</style>
</head>
<body>
<main>
  <header>
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#1f242b"/><circle cx="20" cy="20" r="14" fill="none" stroke="#2bb673" stroke-width="3"/><circle cx="20" cy="20" r="8" fill="none" stroke="#e5383b" stroke-width="3"/><circle cx="20" cy="20" r="3" fill="#e5383b"/></svg>
    <h1>Dart <span>Cam</span></h1>
    <button class="ib" id="bCal" aria-label="Kalibrieren" title="Kalibrieren"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
    <button class="ib" id="bSet" aria-label="Einstellungen" title="Einstellungen"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </header>

  <div class="layout">
    <div>
      <div class="cam" id="cam">
        <video id="vid" playsinline muted autoplay></video>
        <canvas id="ov"></canvas>
        <div class="empty" id="empty"><div><button class="go" id="bStart">Kamera starten</button><p>Handy fest vor der Scheibe montieren</p></div></div>
        <div class="pill"><i></i><span id="st">Kamera aus</span></div>
        <div class="hint" id="hint"></div>
      </div>
      <p class="note" id="tip">Falsch erkannt? Tippe den Wurf an und dann auf die richtige Stelle im Kamerabild.</p>
    </div>
    <div class="side">
      <section class="hero" id="hero"></section>
      <div class="others" id="players"></div>
      <div class="crb" id="crb" hidden></div>
    </div>
  </div>
</main>

<nav class="bar"><div>
  <button id="bMiss">Daneben</button>
  <button id="bUndo">Rückgängig</button>
  <button class="go" id="bNext">Nächster ›</button>
</div></nav>

<section class="sheet" id="settings" hidden><div>
  <div class="grab"></div>
  <h2>Spiel &amp; Kamera</h2>
  <div class="g2">
    <label>Spieler (durch Komma getrennt)<input id="iPl" value="Spieler 1, Spieler 2"></label>
    <label>Spielmodus<select id="iMode"><option value="x01">01-Spiel (301/501 …)</option><option value="cricket">Cricket</option><option value="countup">Count-Up</option><option value="atc">Around the Clock</option><option value="halfit">Half-It</option><option value="shanghai">Shanghai</option></select></label>
    <label data-for="x01">Startpunkte<select id="iStart"><option>501</option><option>301</option><option>701</option><option>901</option></select></label>
    <label data-for="x01">Finish<select id="iOut"><option value="d">Double Out</option><option value="s">Single Out</option></select></label>
    <label data-for="cricket">Cricket-Variante<select id="iCr"><option value="std">Standard</option><option value="cut">Cut-Throat</option></select></label>
    <p class="note" id="mInfo" style="grid-column:1/-1;margin:0"></p>
    <label>Wo hängt das Handy?<select id="iDir">
      <option value="0,1">Unterhalb der Scheibe</option><option value="0,-1">Oberhalb der Scheibe</option>
      <option value="-1,0">Links von der Scheibe</option><option value="1,0">Rechts von der Scheibe</option></select></label>
    <label>Empfindlichkeit<input id="iSens" type="range" min="12" max="60" value="28"></label>
    <label>Ansage per Sprache<select id="iVoice"><option value="1">An</option><option value="0">Aus</option></select></label>
  </div>
  <button class="ok" id="bNew">Neues Spiel starten</button>
  <p class="note" style="margin:0">Tipp: ca. 60–100 cm vor der Scheibe, leicht unter- oder oberhalb, gleichmäßiges Licht.</p>
</div></section>

<div class="win" id="win"><div><div class="num" id="winName"></div><p id="winSub">gewinnt</p><button class="ok" id="bWin">Nochmal spielen</button></div></div>

<script>
window.addEventListener('error',e=>{const h=document.getElementById('hint');if(h)h.textContent='Fehler: '+e.message});
{
const $=id=>document.getElementById(id);
const vid=$('vid'),ov=$('ov'),ctx=ov.getContext('2d'),hint=$('hint'),st=$('st');
const ORDER=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
const CAL_NAMES=['oben am Doppelring der 20','rechts am Doppelring der 6','unten am Doppelring der 3','links am Doppelring der 11'];
const CAL_MM=[[0,-170],[170,0],[0,170],[-170,0]];
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- Homographie ---------- */
function solve(A,b){const n=b.length;for(let i=0;i<n;i++){let m=i;for(let r=i+1;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[m][i]))m=r;[A[i],A[m]]=[A[m],A[i]];[b[i],b[m]]=[b[m],b[i]];for(let r=i+1;r<n;r++){const f=A[r][i]/A[i][i];for(let c=i;c<n;c++)A[r][c]-=f*A[i][c];b[r]-=f*b[i]}}const x=Array(n).fill(0);for(let i=n-1;i>=0;i--){let s=b[i];for(let c=i+1;c<n;c++)s-=A[i][c]*x[c];x[i]=s/A[i][i]}return x}
function homog(src,dst){const A=[],b=[];for(let i=0;i<4;i++){const[x,y]=src[i],[u,v]=dst[i];A.push([x,y,1,0,0,0,-u*x,-u*y]);b.push(u);A.push([0,0,0,x,y,1,-v*x,-v*y]);b.push(v)}const h=solve(A,b);h.push(1);return h}
function apply(h,x,y){const w=h[6]*x+h[7]*y+h[8];return[(h[0]*x+h[1]*y+h[2])/w,(h[3]*x+h[4]*y+h[5])/w]}

/* ---------- Score aus Board-Koordinaten (mm) ---------- */
function scoreAt(x,y){const r=Math.hypot(x,y);if(r<=6.35)return{v:50,m:2,s:25,l:'Bull'};if(r<=15.9)return{v:25,m:1,s:25,l:'25'};if(r>170)return{v:0,m:0,s:0,l:'Daneben'};
  let a=Math.atan2(x,-y)*180/Math.PI;a=(a+360+9)%360;const s=ORDER[Math.floor(a/18)];
  if(r>=99&&r<=107)return{v:3*s,m:3,s,l:'T'+s};if(r>=162)return{v:2*s,m:2,s,l:'D'+s};return{v:s,m:1,s,l:String(s)}}

/* ---------- Spielmodi ---------- */
const HALF=[15,16,'D',17,18,'T',19,20,'B'],CR=[20,19,18,17,16,15,25];
const tLabel=t=>t==='D'?'Beliebiges Double':t==='T'?'Beliebiges Triple':t==='B'||t===25?'Bull':String(t);
const MODES={
 x01:{name:()=>G.start+(G.dOut?' Double Out':' Single Out'),init:()=>({s:G.start}),
  dart(p,d){const n=p.st.s-d.v;if(n<0||(G.dOut&&n===1)||(n===0&&G.dOut&&d.m!==2))return'bust';p.st.s=n;if(n===0)return'win'},
  main:p=>p.st.s,sub:p=>{const c=checkout(p.st.s,3-G.darts.length);return c?'Checkout: '+c:''},rank:(a,b)=>a.st.s-b.st.s},
 cricket:{name:()=>G.cut?'Cut-Throat Cricket':'Cricket',rounds:20,init:()=>({mk:{},pts:0}),
  dart(p,d){if(!CR.includes(d.s))return;for(let k=0;k<d.m;k++){if((p.st.mk[d.s]||0)<3){p.st.mk[d.s]=(p.st.mk[d.s]||0)+1;continue}
    const open=G.pl.filter(q=>q!==p&&(q.st.mk[d.s]||0)<3);if(!open.length)continue;if(G.cut)open.forEach(q=>q.st.pts+=d.s);else p.st.pts+=d.s}
    const closed=CR.every(t=>(p.st.mk[t]||0)>=3),o=G.pl.filter(q=>q!==p).map(q=>q.st.pts);
    if(closed&&(!o.length||(G.cut?p.st.pts<=Math.min(...o):p.st.pts>=Math.max(...o))))return'win'},
  main:p=>p.st.pts,sub:()=>G.cut?'Wenig Punkte gewinnen':'',rank:(a,b)=>G.cut?a.st.pts-b.st.pts:b.st.pts-a.st.pts},
 countup:{name:()=>'Count-Up',rounds:8,init:()=>({pts:0}),dart(p,d){p.st.pts+=d.v},main:p=>p.st.pts,sub:()=>'',rank:(a,b)=>b.st.pts-a.st.pts},
 atc:{name:()=>'Around the Clock',init:()=>({t:1}),
  dart(p,d){const t=p.st.t>20?25:p.st.t;if(d.s===t){if(t===25){p.st.t=22;return'win'}p.st.t++}},
  main:p=>p.st.t>20?'Bull':p.st.t,sub:()=>'Triff die Zahl in Reihenfolge',rank:(a,b)=>b.st.t-a.st.t},
 halfit:{name:()=>'Half-It',rounds:9,init:()=>({pts:40,hit:false}),
  begin(p){p.st.hit=false},
  dart(p,d){const t=HALF[G.round-1];const ok=t==='D'?d.m===2&&d.v>0:t==='T'?d.m===3:t==='B'?d.s===25:d.s===t;if(ok){p.st.pts+=d.v;p.st.hit=true}},
  end(p){if(!p.st.hit){p.st.pts=Math.floor(p.st.pts/2);return'Halbiert!'}},
  main:p=>p.st.pts,sub:()=>'Ziel: '+tLabel(HALF[G.round-1]),rank:(a,b)=>b.st.pts-a.st.pts},
 shanghai:{name:()=>'Shanghai',rounds:7,init:()=>({pts:0,ms:[]}),
  begin(p){p.st.ms=[]},
  dart(p,d){if(d.s!==G.round)return;p.st.pts+=d.v;p.st.ms.push(d.m);if([1,2,3].every(m=>p.st.ms.includes(m)))return'win'},
  main:p=>p.st.pts,sub:()=>'Ziel: '+G.round+' · Single+Double+Triple = Sieg',rank:(a,b)=>b.st.pts-a.st.pts}
};
let G=null,sel=-1,M=null;
const clone=o=>JSON.parse(JSON.stringify(o));
function newGame(){const names=$('iPl').value.split(',').map(s=>s.trim()).filter(Boolean);
  G={mode:$('iMode').value,start:+$('iStart').value,dOut:$('iOut').value==='d',cut:$('iCr').value==='cut',round:1,cur:0,darts:[],done:false,bust:false,over:false,note:''};
  M=MODES[G.mode];G.pl=(names.length?names:['Spieler 1']).map(n=>({n}));G.pl.forEach(p=>p.st=M.init());G.snap=clone(G.pl.map(p=>p.st));
  saveSettings();render();say(M.name())}
function replay(){G.pl.forEach((p,i)=>p.st=clone(G.snap[i]));const p=G.pl[G.cur];G.bust=false;G.done=false;G.note='';let res;
  for(const d of G.darts){d.bust=false;res=M.dart(p,d);if(res==='bust'){d.bust=true;G.bust=true;G.done=true;G.pl.forEach((q,i)=>q.st=clone(G.snap[i]));break}if(res==='win')break}
  if(G.darts.length>=3&&!G.bust&&res!=='win'){G.done=true;if(M.end)G.note=M.end(p)||''}
  render();if(res==='win')finish(p)}
function addDart(d){if(G.done||G.over)return;G.darts.push(d);say(d.l==='Daneben'?'Daneben':d.l.replace('T','Triple ').replace('D','Double '));replay();
  if(G.bust)say('Überworfen');else if(G.note)say(G.note);else if(G.done&&!G.over&&(G.mode==='x01'||G.mode==='countup'))say(G.darts.reduce((a,d)=>a+d.v,0)+' Punkte')}
function nextTurn(){if(G.over)return;lastN=0;const p=G.pl[G.cur];
  if(!G.done&&M.end){G.note=M.end(p)||''}
  G.cur=(G.cur+1)%G.pl.length;if(G.cur===0)G.round++;
  if(M.rounds&&G.round>M.rounds){G.round=M.rounds;const r=[...G.pl].sort(M.rank);if(r.length>1&&M.rank(r[0],r[1])===0){G.over=true;G.done=true;$('winName').textContent='Unentschieden';$('winSub').textContent=M.name()+' · '+M.main(r[0])+' Punkte';$('win').classList.add('on');say('Unentschieden');render();return}finish(r[0]);return}
  if(M.begin)M.begin(G.pl[G.cur]);G.snap=clone(G.pl.map(q=>q.st));G.darts=[];G.done=false;G.bust=false;G.note='';sel=-1;render();
  const q=G.pl[G.cur];say(q.n+(G.mode==='x01'?', noch '+q.st.s:M.sub(q).startsWith('Ziel')?', '+M.sub(q).split('·')[0]:''))}
function finish(p){G.over=true;G.done=true;$('winName').textContent=p.n;
  $('winSub').textContent=M.name()+' · '+(G.mode==='x01'?'Leg gewonnen':G.mode==='atc'?'als Erster rum':M.main(p)+' Punkte');
  $('win').classList.add('on');say(p.n+' gewinnt!')}

/* Checkout-Vorschlag */
const THROWS=[];for(let s=20;s>=1;s--)THROWS.push({v:3*s,m:3,l:'T'+s});THROWS.push({v:50,m:2,l:'Bull'},{v:25,m:1,l:'25'});for(let s=20;s>=1;s--)THROWS.push({v:2*s,m:2,l:'D'+s},{v:s,m:1,l:String(s)});
function checkout(rest,n){if(rest>170||rest<2&&G.dOut||n<1)return'';const fin=THROWS.filter(t=>!G.dOut||t.m===2);
  for(let k=1;k<=n;k++){const r=find(rest,k,fin);if(r)return r.join(' · ')}return''}
function find(rest,k,fin){if(k===1){const f=fin.find(t=>t.v===rest);return f?[f.l]:null}for(const t of THROWS){if(t.v>=rest)continue;const r=find(rest-t.v,k-1,fin);if(r)return[t.l,...r]}return null}

let lastN=0;
const MARK=['','/','X','Ⓧ'];
function render(){
  const p=G.pl[G.cur],sum=G.darts.reduce((a,d)=>a+d.v,0),sub=G.done&&G.mode==='x01'?'':M.sub(p);
  const slots=[0,1,2].map(i=>{const d=G.darts[i];if(!d)return`<div class="slot">Dart ${i+1}</div>`;
    return`<button class="slot f t${d.m}${i===sel?' sel':''}${d.bust?' bust':''}${i>=lastN?' new':''}" data-i="${i}"><span><b>${esc(d.l)}</b>${d.v} P.</span></button>`}).join('');
  lastN=G.darts.length;
  const rnd=M.rounds?`Runde ${G.round}/${M.rounds}`:`Runde ${G.round}`;
  $('hero').innerHTML=`<div class="who"><b id="pn"></b><span class="tag">${esc(M.name())} · ${rnd}</span></div><div class="score num">${esc(M.main(p))}</div>
    <div class="co">${sub?`<span>${esc(sub)}</span>`:''}</div><div class="slots" id="turn">${slots}</div>
    <div class="sum${G.bust?' bust':''}"><span>Diese Runde</span><b>${G.bust?'Überworfen':G.note?esc(G.note):G.mode==='cricket'?G.darts.reduce((a,d)=>a+(CR.includes(d.s)?d.m:0),0)+' Marks':sum+' Punkte'}</b></div>`;
  $('pn').textContent=p.n;
  const rest=G.pl.map((q,i)=>i).filter(i=>i!==G.cur);
  $('players').innerHTML=rest.map(i=>`<div class="op"><div class="av"></div><div class="n"></div><div class="num">${esc(M.main(G.pl[i]))}</div></div>`).join('');
  [...document.querySelectorAll('.op')].forEach((e,k)=>{const n=G.pl[rest[k]].n;e.querySelector('.av').textContent=n.charAt(0).toUpperCase();e.querySelector('.n').textContent=n});
  const cb=$('crb');if(G.mode==='cricket'){cb.hidden=false;
    cb.innerHTML=`<table><thead><tr><th></th>${G.pl.map((q,i)=>`<th class="${i===G.cur?'on':''}">${esc(q.n)}</th>`).join('')}</tr></thead><tbody>${CR.map(t=>`<tr><td class="num">${t===25?'Bull':t}</td>${G.pl.map(q=>{const k=Math.min(q.st.mk[t]||0,3);return`<td class="mk m${k}">${MARK[k]}</td>`}).join('')}</tr>`).join('')}</tbody></table>`}else cb.hidden=true;
  drawOverlay()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';')}
$('hero').addEventListener('click',e=>{const b=e.target.closest('.slot.f');if(!b)return;const i=+b.dataset.i;sel=sel===i?-1:i;render();
  if(sel>=0)hint.textContent='Tippe im Kamerabild auf die richtige Stelle dieses Darts.';else hint.textContent=''});

/* ---------- Sprache ---------- */
function say(t){if($('iVoice').value!=='1'||!window.speechSynthesis)return;try{const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';speechSynthesis.speak(u)}catch(e){}}

/* ---------- Kamera & Kalibrierung ---------- */
let H=store.get('dc_H'),Hinv=store.get('dc_Hinv'),cal=null,running=false;
async function startCam(){
  st.textContent='Kamera wird gestartet …';hint.textContent='Kamera wird gestartet … Bitte den Kamerazugriff erlauben, falls gefragt.';
  if(/FBAN|FBAV|Instagram|WhatsApp|Line\/|GSA\/|wv\)/.test(navigator.userAgent)){hint.textContent='Du bist im eingebauten Browser einer App. Kopiere den Link und öffne ihn direkt in Chrome oder Safari.'}
  if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){hint.textContent='Dieser Browser erlaubt hier keinen Kamerazugriff. Öffne den Link direkt in Chrome (Android) oder Safari (iPhone).';st.textContent='Keine Kamera';return}
  const slow=setTimeout(()=>{hint.textContent='Die Kamera antwortet nicht. Prüfe, ob der Browser Kamerazugriff hat (Handy-Einstellungen → Apps → Chrome/Safari → Kamera) und lade die Seite neu.'},8000);
  try{let s;try{s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false})}
    catch(e){if(e.name==='NotAllowedError'||e.name==='SecurityError')throw e;s=await navigator.mediaDevices.getUserMedia({video:true,audio:false})}
    vid.srcObject=s;try{await vid.play()}catch(e){}}
  catch(e){clearTimeout(slow);st.textContent='Keine Kamera';hint.textContent=(e.name==='NotAllowedError'?'Kamerazugriff wurde abgelehnt. Tippe auf das Schloss/„aA“ neben der Adresse, erlaube die Kamera und lade neu.':'Kamera nicht verfügbar: '+e.name+' '+e.message);return}
  clearTimeout(slow);hint.textContent='';
  try{await navigator.wakeLock?.request('screen')}catch(e){}
  $('empty').hidden=true;$('cam').classList.add('live');running=true;
  if(!H)startCal();else{hint.textContent='';resetRefs();st.textContent='Bereit – wirf!'}
  loop()}
function startCal(){cal=[];st.textContent='Kalibrierung';hint.textContent='Kalibrierung 1/4: Tippe '+CAL_NAMES[0]+'.';drawOverlay()}
ov.addEventListener('pointerdown',e=>{const r=ov.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
  if(cal){cal.push([x,y]);if(cal.length<4){hint.textContent=`Kalibrierung ${cal.length+1}/4: Tippe ${CAL_NAMES[cal.length]}.`;drawOverlay();return}
    H=homog(cal,CAL_MM);Hinv=homog(CAL_MM,cal);store.set('dc_H',H);store.set('dc_Hinv',Hinv);cal=null;mask=null;resetRefs();st.textContent='Bereit – wirf!';drawOverlay();
    hint.textContent='Kalibrierung fertig ✓ Liegen die Ringe auf der Scheibe? Dann einfach werfen. Sonst nochmal „Kalibrieren“.';say('Kalibrierung fertig');setTimeout(()=>{if(!cal&&sel<0)hint.textContent=''},6000);return}
  if(sel>=0&&H){const[mx,my]=apply(H,x,y);const s=scoreAt(mx,my);Object.assign(G.darts[sel],s,{x,y});sel=-1;hint.textContent='';replay()}});

function drawOverlay(){
  const w=ov.width=ov.clientWidth*devicePixelRatio,h=ov.height=ov.clientHeight*devicePixelRatio;ctx.clearRect(0,0,w,h);
  if(cal){ctx.fillStyle='#e7d6ae';cal.forEach(([x,y])=>{ctx.beginPath();ctx.arc(x*w,y*h,8*devicePixelRatio,0,7);ctx.fill()});return}
  if(!Hinv)return;ctx.lineWidth=1.5*devicePixelRatio;
  for(const[r,c]of[[170,'#1f9a4c'],[162,'#1f9a4c'],[107,'#d8312a'],[99,'#d8312a'],[15.9,'#e7d6ae'],[6.35,'#e7d6ae']]){ctx.strokeStyle=c;ctx.beginPath();
    for(let a=0;a<=64;a++){const t=a/64*2*Math.PI,[x,y]=apply(Hinv,r*Math.sin(t),-r*Math.cos(t));a?ctx.lineTo(x*w,y*h):ctx.moveTo(x*w,y*h)}ctx.stroke()}
  ctx.strokeStyle='rgba(231,214,174,.35)';for(let i=0;i<20;i++){const t=(i*18+9)*Math.PI/180,[x1,y1]=apply(Hinv,15.9*Math.sin(t),-15.9*Math.cos(t)),[x2,y2]=apply(Hinv,170*Math.sin(t),-170*Math.cos(t));ctx.beginPath();ctx.moveTo(x1*w,y1*h);ctx.lineTo(x2*w,y2*h);ctx.stroke()}
  if(G)G.darts.forEach((d,i)=>{if(d.x==null)return;ctx.fillStyle=i===sel?'#e7d6ae':'#ffd400';ctx.beginPath();ctx.arc(d.x*w,d.y*h,7*devicePixelRatio,0,7);ctx.fill();ctx.font=`${14*devicePixelRatio}px Oswald`;ctx.fillText(d.l,d.x*w+10*devicePixelRatio,d.y*h-8*devicePixelRatio)})}

/* ---------- Bilderkennung ---------- */
const SW=240;let SH=135,work=document.createElement('canvas'),wctx=work.getContext('2d',{willReadFrequently:true});
let prev=null,ref=null,empty=null,mask=null,maskN=0,stable=0,clearWait=0;
function gray(){wctx.drawImage(vid,0,0,SW,SH);const d=wctx.getImageData(0,0,SW,SH).data,g=new Uint8Array(SW*SH);for(let i=0,j=0;i<g.length;i++,j+=4)g[i]=(d[j]*77+d[j+1]*150+d[j+2]*29)>>8;return g}
function buildMask(){mask=new Uint8Array(SW*SH);maskN=0;for(let y=0;y<SH;y++)for(let x=0;x<SW;x++){const[mx,my]=apply(H,(x+.5)/SW,(y+.5)/SH);if(Math.hypot(mx,my)<=182){mask[y*SW+x]=1;maskN++}}}
function resetRefs(){ref=null;empty=null;prev=null;stable=0}
function loop(){if(!running)return;
  if(vid.videoWidth&&H&&!cal){SH=Math.round(SW*vid.videoHeight/vid.videoWidth);if(work.width!==SW||work.height!==SH){work.width=SW;work.height=SH;mask=null;resetRefs()}
    if(!mask)buildMask();step(gray())}
  setTimeout(()=>requestAnimationFrame(loop),90)}
function diffCount(a,b,th){let n=0;for(let i=0;i<a.length;i++)if(mask[i]&&Math.abs(a[i]-b[i])>th)n++;return n}
function step(cur){
  const th=+$('iSens').value;
  if(!ref){ref=cur;empty=cur;prev=cur;return}
  const motion=diffCount(cur,prev,th);prev=cur;
  if(motion>maskN*.01){stable=0;st.textContent='Bewegung … '+Math.round(motion/maskN*100)+'%';return}
  if(++stable<4)return;
  const changed=diffCount(cur,ref,th);
  if(G.done||G.over){
    st.textContent='Darts ziehen …';
    if(diffCount(cur,empty,th)<maskN*.004){if(++clearWait>2){clearWait=0;ref=cur;empty=cur;nextTurn()}}else clearWait=0;
    if(changed>0)ref=cur;return}
  st.textContent='Bereit – wirf! ('+G.pl[G.cur].n+')';
  if(changed<6)return;
  if(changed>maskN*.12){ /* großer Unterschied: Darts gezogen oder Licht geändert */
    if(G.darts.length&&diffCount(cur,empty,th)<maskN*.004){ref=cur;empty=cur;nextTurn()}else{ref=cur}return}
  const tip=findTip(cur,ref,th);ref=cur;if(!tip)return;
  const[mx,my]=apply(H,tip[0],tip[1]);addDart({...scoreAt(mx,my),x:tip[0],y:tip[1]})}
function findTip(cur,old,th){
  const[dx,dy]=$('iDir').value.split(',').map(Number);const on=new Uint8Array(cur.length);
  for(let i=0;i<cur.length;i++)if(mask[i]&&Math.abs(cur[i]-old[i])>th)on[i]=1;
  let best=-1e9,pts=[];
  for(let y=1;y<SH-1;y++)for(let x=1;x<SW-1;x++){const i=y*SW+x;if(!on[i])continue;
    if(on[i-1]+on[i+1]+on[i-SW]+on[i+SW]<2)continue;const p=x*dx+y*dy;pts.push([x,y,p]);if(p>best)best=p}
  if(pts.length<4)return null;const near=pts.filter(q=>q[2]>=best-1.5);
  const ax=near.reduce((a,q)=>a+q[0],0)/near.length,ay=near.reduce((a,q)=>a+q[1],0)/near.length;
  return[(ax+.5)/SW,(ay+.5)/SH]}

/* ---------- Buttons & Einstellungen ---------- */
function saveSettings(){store.set('dc_set',{mo:$('iMode').value,cr:$('iCr').value,pl:$('iPl').value,st:$('iStart').value,o:$('iOut').value,d:$('iDir').value,s:$('iSens').value,v:$('iVoice').value})}
const S=store.get('dc_set');if(S){if(S.mo)$('iMode').value=S.mo;if(S.cr)$('iCr').value=S.cr;$('iPl').value=S.pl;$('iStart').value=S.st;$('iOut').value=S.o;$('iDir').value=S.d;$('iSens').value=S.s;$('iVoice').value=S.v}
['iDir','iSens','iVoice'].forEach(id=>$(id).addEventListener('change',saveSettings));
const INFO={x01:'Von der Startzahl runter auf genau 0. Bei Double Out muss der letzte Dart ein Double oder Bull sein.',cricket:'20 bis 15 und Bull je 3-mal treffen, um sie zu schließen. Danach gibt es Punkte, solange der Gegner offen ist. Cut-Throat: Punkte gehen an die Gegner, wenig ist gut. Max. 20 Runden.',countup:'8 Runden, alle Punkte zählen. Höchste Summe gewinnt.',atc:'1 bis 20 der Reihe nach treffen, zum Schluss Bull. Wer zuerst durch ist, gewinnt.',halfit:'Start mit 40. Jede Runde ein Ziel (15, 16, Double, 17, 18, Triple, 19, 20, Bull). Kein Treffer in der Runde = Punkte halbiert.',shanghai:'7 Runden, Ziel ist die Rundenzahl. Single, Double und Triple der Zahl in einer Runde = sofortiger Sieg.'};
function modeUI(){const m=$('iMode').value;document.querySelectorAll('[data-for]').forEach(e=>e.hidden=e.dataset.for!==m);$('mInfo').textContent=INFO[m]}
$('iMode').addEventListener('change',modeUI);modeUI();
$('bStart').onclick=startCam;
$('bCal').onclick=()=>{if(!running){hint.textContent='Erst die Kamera starten.';return}startCal()};
$('bSet').onclick=()=>{$('settings').hidden=false};
$('settings').addEventListener('click',e=>{if(e.target.id==='settings')$('settings').hidden=true});
$('bNew').onclick=()=>{newGame();resetRefs();$('settings').hidden=true};
$('bMiss').onclick=()=>addDart({v:0,m:0,s:0,l:'Daneben'});
$('bNext').onclick=()=>{nextTurn();resetRefs()};
$('bUndo').onclick=()=>{if(G.over)return;G.darts.pop();sel=-1;replay();resetRefs()};
$('bWin').onclick=()=>{$('win').classList.remove('on');newGame();resetRefs()};
new ResizeObserver(drawOverlay).observe(ov);
window.dc={addDart,nextTurn,get G(){return G}};
newGame();
}
</script>
</body>
